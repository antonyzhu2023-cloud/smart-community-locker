# Continuous integration for the Smart Community Locker System.
#
# Runs on every push and pull request. Getting this green BEFORE any feature
# exists is deliberate: the run history is the evidence for report Section 3.2
# that CI was part of the process, not bolted on at the end.
#
# The Cloud Functions job is added in Sprint 2, when functions/ exists.

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      # QR6 asks for at least 70% line coverage on ViewModel and repository code.
      #
      # The gate measures the whole of lib/, not a list of directories. It used to
      # name lib/viewmodels and lib/repositories explicitly and skip lib/views, on
      # the grounds that views were thin. That was true when it was written and
      # stopped being true once the views grew a confirmation dialog, and nothing
      # reported the change: a gate with a hand-maintained scope goes stale in
      # silence, and any directory added later would be unmeasured by default.
      # Measuring everything removes that failure mode. The QR6 figure is still
      # reported on its own, and still gated on its own, so the requirement can be
      # evidenced directly.
      #
      # There is now exactly one exclusion. Three files under
      # lib/repositories/firebase/ do nothing but call Firebase: they need a
      # running emulator suite to execute at all, so a unit test of them would be
      # a test of the Firebase SDK. Excluding them is a different decision from
      # the stale directory list above, and it is kept from rotting the same way
      # by the check below: if an excluded file stops existing, the build fails
      # and somebody has to look at the list. An exclusion nobody is forced to
      # revisit is how the first gate went wrong.
      #
      # The excluded files are covered by the manual end-to-end procedure in
      # docs/evaluation/, not by nothing.
      #
      # lcov.info is parsed here rather than with the lcov tool, because lcov 2.x
      # on the runner rejects the generated file in strict mode.
      - name: Check the coverage exclusion list is still real
        run: |
          for f in \
            app/lib/repositories/firebase/firebase_bootstrap.dart \
            app/lib/repositories/firebase/functions_access_backend.dart \
            app/lib/repositories/firebase/mirrored_repositories.dart
          do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f is excluded from the coverage gate but no longer exists."
              echo "Update the exclusion in this workflow rather than leaving it stale."
              exit 1
            fi
          done
          echo "PASS: all 3 excluded files still exist"

      - name: Coverage gate (lib >= 70%, QR6 layers >= 70%)
        run: |
          awk '
            /^SF:/ {
              file = substr($0, 4)
              # lcov.info uses backslashes when generated on Windows and forward
              # slashes on the Linux runner. Normalise so the gate gives the same
              # answer in both places.
              gsub(/\\/, "/", file)

              # The one exclusion. See the note above this step.
              skip = (file ~ /lib\/repositories\/firebase\/(firebase_bootstrap|functions_access_backend|mirrored_repositories)\.dart$/)
              next
            }
            /^DA:/ {
              if (skip) next

              split(substr($0, 4), a, ",")
              covered = (a[2] + 0 > 0)

              fileTotal[file]++
              if (covered) fileHit[file]++

              allTotal++
              if (covered) allHit++

              if (file ~ /lib\/(viewmodels|repositories)\//) {
                qrTotal++
                if (covered) qrHit++
              }
              next
            }
            END {
              if (allTotal == 0) {
                print "FAIL: no coverage data found under lib/"
                exit 1
              }

              # Unsorted on purpose: asorti is a gawk extension and the runner
              # does not guarantee gawk. Order does not matter in a log.
              for (f in fileTotal) {
                printf "  %6.2f%%  %4d/%-4d  %s\n",
                       fileHit[f] * 100 / fileTotal[f], fileHit[f], fileTotal[f], f
              }

              all = allHit * 100 / allTotal
              qr  = qrTotal ? qrHit * 100 / qrTotal : 0
              printf "\n  whole of lib/                  : %.2f%% (%d/%d)\n", all, allHit, allTotal
              printf "  QR6 viewmodels + repositories  : %.2f%% (%d/%d)\n", qr, qrHit, qrTotal

              failed = 0
              if (all < 70) { print "FAIL: lib/ is below the 70% gate"; failed = 1 }
              if (qrTotal == 0) {
                print "FAIL: no lines found under lib/viewmodels or lib/repositories"
                failed = 1
              } else if (qr < 70) {
                print "FAIL: the QR6 layers are below the 70% gate"
                failed = 1
              }
              if (failed) exit 1
              print "PASS: coverage gate met"
            }
          ' coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/

  # Deferred from Sprint 0, when functions/ did not exist yet and this job
  # failed the whole workflow by pointing at a missing directory.
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Type checking is the static analysis step on this side, and the
      # tsconfig is strict: no implicit any, no unused locals, no fallthrough.
      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      # The access rules exist twice, once in Dart and once in TypeScript,
      # because the app and the backend are in different languages and cannot
      # share a module. Both are run against the same table of cases. If one
      # side drifts, this is where it shows.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/
